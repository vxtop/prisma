name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
      - name: "End-to-end (headless Chrome; informative on CI: software rendering is slow)"
        if: matrix.node == 22
        continue-on-error: true
        timeout-minutes: 15
        run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: always() && matrix.node == 22
        with:
          name: screenshots-${{ matrix.os }}-${{ matrix.node }}
          path: test/artifacts/
