<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vxtop</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="vxtop" content="__VXTOP_TOKEN__">
<link rel="stylesheet" href="/app.css">
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-cube" viewBox="0 0 24 24"><path d="M12 3 20 7.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3 21 8l-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5h6l2 2h10V19H3z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
  <symbol id="i-space" viewBox="0 0 24 24"><path d="M12 3 20 7.5v9L12 21l-8-4.5v-9z"/></symbol>
  <symbol id="i-system" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><circle cx="5" cy="6" r="1.8"/><circle cx="19" cy="6" r="1.8"/><circle cx="5" cy="18" r="1.8"/><circle cx="19" cy="18" r="1.8"/><path d="m6.5 7.2 3.6 3.2m7.4-3.2-3.6 3.2m-7.4 6.6 3.6-3.2m7.4 3.2-3.6-3.2"/></symbol>
  <symbol id="i-cluster" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" stroke-dasharray="2 3"/></symbol>
  <symbol id="i-stack" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="4" rx="1"/><rect x="5" y="10" width="14" height="4" rx="1"/><rect x="5" y="16" width="14" height="4" rx="1"/></symbol>
  <symbol id="i-tree" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></symbol>
  <symbol id="i-orbit" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><ellipse cx="12" cy="12" rx="9" ry="4.5" transform="rotate(-25 12 12)"/></symbol>
  <symbol id="i-explode" viewBox="0 0 24 24"><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M4 4l3 3M20 4l-3 3M4 20l3-3M20 20l-3-3"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-5H9v5H4z"/></symbol>
  <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
  <symbol id="i-drives" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="2"/><path d="M17 12h.01"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="m16 9 5 6m0-6-5 6"/></symbol>
  <symbol id="i-zin" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5M8 11h6M11 8v6"/></symbol>
  <symbol id="i-zout" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5M8 11h6"/></symbol>
  <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
</svg>
<canvas id="gl"></canvas>
<canvas id="hud2"></canvas><div id="dock"></div>

<div id="top">
  <span id="brand"><img src="/favicon.svg" alt="">VXTOP</span><span class="badge" data-tip="Monitor de solo lectura|No crea, modifica ni borra archivos y no actúa sobre procesos ni sobre el sistema.">SOLO LECTURA</span>
  <div class="sep"></div>
  <div class="seg" id="view"><button data-v="espacio" class="on" data-tip="Espacio de directorios|Cada carpeta abierta es un cubo." data-key="V"><svg class="i"><use href="#i-space"/></svg><span class="tl">Espacio</span></button><button data-v="sistema" data-tip="Vista Sistema|Aplicaciones, terminales, procesos y conexiones." data-key="V"><svg class="i"><use href="#i-system"/></svg><span class="tl">Sistema</span></button><button data-v="tareas" data-tip="Tareas|El administrador de tareas en 3D: aplicaciones, segundo plano, Windows, rendimiento, red, archivos en uso, servicios, inicio y usuarios. Solo lectura." data-key="T"><svg class="i"><use href="#i-grid"/></svg><span class="tl">Tareas</span></button><button data-v="arbol" data-tip="Árbol|Como «tree»: cada carpeta y sus subcarpetas, cada una con su cubo ligero. Doble clic despliega o contrae; miles de carpetas a la vez." data-key="A"><svg class="i"><use href="#i-tree"/></svg><span class="tl">Árbol</span></button></div>
  <div class="sep"></div>
  <div id="pathw"><svg class="i"><use href="#i-search"/></svg><input id="path" placeholder="Buscar carpeta…" spellcheck="false" autocomplete="off" data-tip="Buscar|Escribe un nombre (sonid…) o una ruta (C:\Us…). Intro abre como cubo · Mayús+Intro con subcarpetas · varias rutas con «;»."><div id="srch"></div></div>
  <button id="b-open" class="ico" data-tip="Abrir como cubo|Abre la carpeta escrita (Intro)."><svg class="i"><use href="#i-cube"/></svg></button>
  <button id="b-expand" class="ico" data-tip="Abrir y desplegar|Abre la carpeta y sus subcarpetas (Mayús+Intro)."><svg class="i"><use href="#i-layers"/></svg></button>
  <div class="sep sp"></div>
  <div class="seg sp" id="lay"><button data-m="cluster" class="ico" data-tip="Clúster|Los hijos orbitan alrededor de su carpeta." data-key="1"><svg class="i"><use href="#i-cluster"/></svg></button><button data-m="stack" class="ico" data-tip="Pila|Los hijos se apilan detrás, ordenados por tamaño." data-key="2"><svg class="i"><use href="#i-stack"/></svg></button><button data-m="grid" class="ico" data-tip="Red|Todos los cubos en una rejilla." data-key="3"><svg class="i"><use href="#i-grid"/></svg></button><button data-m="orbit" class="ico" data-tip="Órbita|Como Clúster, pero en movimiento." data-key="4"><svg class="i"><use href="#i-orbit"/></svg></button></div>
  <div class="seg sp" id="sl"><button data-a="0" data-tip="Corte por tipo|Código · datos · documentos. Pulsa otra vez para la siguiente capa." data-key="X">X</button><button data-a="1" data-tip="Corte por profundidad|Raíz · niveles 1–2 · nivel 3+." data-key="Y">Y</button><button data-a="2" data-tip="Corte por antigüedad|Menos de 24 h · 30 días · histórico." data-key="Z">Z</button></div>
  <button id="b-ex" class="ico sp" data-tip="Explotar el cubo|Separa las 27 celdas para ver el interior." data-key="E"><svg class="i"><use href="#i-explode"/></svg></button>
  <div class="grow"></div>
  <span id="load"></span>
  <button id="b-follow" class="ai" data-tip="Seguir|Acompaña en vivo a la IA o al proceso seleccionado: qué abre, lee, escribe y con quién conecta. Solo observa." data-key="Espacio"><svg class="i"><use href="#i-eye"/></svg><span class="tl">Seguir</span></button>
  <button id="b-home" class="ico" data-tip="Encuadrar todo|Vuelve a ver todo el espacio." data-key="H"><svg class="i"><use href="#i-home"/></svg></button>
  <button id="b-scn" class="ico" data-tip="Escenas|Guarda y recupera lo que tienes abierto."><svg class="i"><use href="#i-bookmark"/></svg></button>
  <button id="b-set" class="ico" data-tip="Ajustes|Profundidad de visión, brillo, flujo, tamaños."><svg class="i"><use href="#i-gear"/></svg></button>
  <button id="b-help" class="ico" data-tip="Ayuda|Controles, atajos y leyenda de colores." data-key="?"><svg class="i"><use href="#i-help"/></svg></button>
</div>
<div id="spaces"></div>
<nav id="crumb"></nav>
<div id="hud"></div>

<div id="left" class="panel">
  <h2>Capas del sistema</h2>
  <div class="layer" style="--k:#e8a33d" data-tip="Agentes de IA|Sesiones de Claude Code de todas las cuentas del equipo."><div class="lh"><i>5</i><b>Agentes</b><span id="L5">—</span></div><div id="L5s"></div></div>
  <div class="layer" style="--k:#aeb6bd" data-tip="Versiones|Estado de git del cubo seleccionado."><div class="lh"><i>4</i><b>Versiones</b><span id="L4">—</span></div><div class="ll" id="L4a"></div></div>
  <div class="layer" style="--k:#4fb3ad" data-tip="Archivos|Totales de los cubos abiertos y eventos de disco."><div class="lh"><i>3</i><b>Archivos</b><span id="L3">—</span></div><div class="ll" id="L3a"></div><div class="ll" id="L3b"></div></div>
  <div class="layer" style="--k:#aeb6bd" data-tip="Procesos|Número de procesos, E/S de disco total y el que más CPU usa."><div class="lh"><i>2</i><b>Procesos</b><span id="L2">—</span></div><div class="ll" id="L2a"></div><div class="ll" id="L2b"></div></div>
  <div class="layer" style="--k:#aeb6bd"><div class="lh"><i>1</i><b>Hardware</b><span id="L1">—</span></div>
    <div class="hw">
      <span>CPU</span><div class="bar"><i id="h-cpu"></i></div><span id="v-cpu">—</span>
      <span>RAM</span><div class="bar"><i id="h-ram"></i></div><span id="v-ram">—</span>
      <span>GPU</span><div class="bar"><i id="h-gpu"></i></div><span id="v-gpu">—</span>
      <span>VRAM</span><div class="bar"><i id="h-vram"></i></div><span id="v-vram">—</span>
      <span>Disco</span><div class="bar"><i id="h-disk"></i></div><span id="v-disk">—</span>
    </div>
    <canvas id="spark" width="520" height="48"></canvas>
  </div>
  <div id="ltabs"><button data-l="cubes" class="on">Cubos <span id="ncubes"></span></button><button data-l="explorer">Explorador</button></div>
  <div id="cubes"></div>
  <div id="explorer" style="display:none"></div>
</div>

<div id="right" class="panel">
  <div id="rh"><b id="rn"></b><span><button id="r-exp" data-tip="Desplegar|Abre sus subcarpetas como cubos."><svg class="i"><use href="#i-layers"/></svg></button><button id="r-close" class="ico" data-tip="Cerrar"><svg class="i"><use href="#i-close"/></svg></button></span></div>
  <div id="rp"></div>
  <div id="tabs"></div>
  <div id="tab"></div>
</div>

<div id="vbar" class="panel"></div>
<div id="ticker" class="panel"><span class="lab">En vivo</span><div id="feed"></div><span id="fps"></span></div>
<div id="trbar"><svg class="i"><use href="#i-tree"/></svg><b id="trname">Árbol</b><span id="trinfo"></span><span class="trs"></span><span class="trl">Niveles</span><div class="seg"><button data-lv="1" data-tip="Como tree -L 1|Abierto hasta 1 nivel desde la raíz.">1</button><button data-lv="2" data-tip="Como tree -L 2|Abierto hasta 2 niveles desde la raíz.">2</button><button data-lv="3" data-tip="Como tree -L 3|Abierto hasta 3 niveles desde la raíz.">3</button><button data-lv="4" data-tip="Como tree -L 4|Abierto hasta 4 niveles desde la raíz.">4</button><button data-lv="5" data-tip="Como tree -L 5|Abierto hasta 5 niveles desde la raíz.">5</button><button data-lv="6" data-tip="Como tree -L 6|Abierto hasta 6 niveles desde la raíz.">6</button></div><button data-tb="all" data-tip="Desplegar todo|Hasta 12 niveles, con el tope de carpetas.">Todo</button><button data-tb="none" data-tip="Contraer todo|Solo la raíz y sus subcarpetas.">Contraer</button><button data-tb="up" data-tip="Subir|La carpeta superior pasa a ser la raíz.">Subir</button><span class="trs"></span><div class="seg"><button data-tm="plano" data-tip="Plano|Como tree: cada nivel una fila más atrás.">Plano</button><button data-tm="radial" data-tip="Radial|La raíz en el centro y cada nivel un anillo.">Radial</button></div><button data-tb="fit" data-tip="Encuadrar el árbol" data-key="H">Encuadrar</button></div>
<div id="empty"><b>No hay nada abierto</b><p>Escribe una ruta arriba, usa el <u data-e="ex">explorador</u> o empieza por:</p><div id="emptyq"></div><p class="hint">Pulsa <kbd>?</kbd> para ver los controles · <kbd>V</kbd> cambia a la vista Sistema</p></div>
<div id="tip"></div><div id="ctx"></div><div id="set" class="panel pop"></div><div id="fade"></div><div id="scn" class="panel pop"></div><div id="help" class="panel pop"></div><div id="modal"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
